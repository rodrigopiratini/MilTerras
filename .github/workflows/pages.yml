# Publica os apps no GitHub Pages a cada push na main (ou no branch padrão do repositório, se for outro).
# Requer uma vez: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Publicar apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar site
        run: |
          mkdir -p _site
          # tudo o que é site (fica de fora só o que é de bastidor)
          for f in *; do case "$f" in _site|supabase|scripts|docs|README.md|CLAUDE.md|package*.json|node_modules) ;; *) cp -r "$f" _site/ ;; esac; done
          cp .nojekyll _site/
          # versão desta publicação: o app compara com version.json e oferece o botão Atualizar
          V="${GITHUB_SHA}"
          echo "{\"v\":\"$V\",\"em\":\"$(date -u +%FT%TZ)\"}" > _site/version.json
          echo "export const VERSAO = '$V';" > _site/src/js/versao.js
          # cache offline: todos os arquivos do site
          LISTA=$(cd _site && find . -type f ! -name 'version.json' ! -name '.nojekyll' ! -name 'CNAME' | sed 's#^\./##' | sort | sed "s/.*/'&'/" | paste -sd, -)
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'ea-${V:0:12}'/; s#const CORE = \[.*\];#const CORE = ['./', $LISTA];#" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
